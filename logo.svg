<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E68A5C"/>
      <stop offset="50%" style="stop-color:#9577C8"/>
      <stop offset="100%" style="stop-color:#5C9CC8"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#FBF6E9"/>
  
  <!-- AI Logo - Abstract neural network / brain shape -->
  <g transform="translate(136, 136)">
    <!-- Central node -->
    <circle cx="120" cy="120" r="50" fill="url(#ai-grad)"/>
    
    <!-- Orbital rings -->
    <ellipse cx="120" cy="120" rx="140" ry="65" fill="none" stroke="#9577C8" stroke-width="4" opacity="0.5" transform="rotate(-20, 120, 120)"/>
    <ellipse cx="120" cy="120" rx="140" ry="65" fill="none" stroke="#E68A5C" stroke-width="4" opacity="0.5" transform="rotate(40, 120, 120)"/>
    <ellipse cx="120" cy="120" rx="140" ry="65" fill="none" stroke="#5C9CC8" stroke-width="4" opacity="0.5" transform="rotate(100, 120, 120)"/>
    
    <!-- Outer nodes -->
    <circle cx="-16" cy="70" r="18" fill="#E8B84A"/>
    <circle cx="256" cy="170" r="18" fill="#7AAA5C"/>
    <circle cx="40" cy="220" r="18" fill="#E68A5C"/>
    <circle cx="200" cy="20" r="18" fill="#9577C8"/>
    <circle cx="240" cy="90" r="18" fill="#5C9CC8"/>
    <circle cx="8" cy="150" r="18" fill="#FFEFB5" stroke="#E8B84A" stroke-width="3"/>
    
    <!-- Connection lines -->
    <line x1="-16" y1="70" x2="70" y2="100" stroke="#E8B84A" stroke-width="3" opacity="0.6"/>
    <line x1="256" y1="170" x2="170" y2="140" stroke="#7AAA5C" stroke-width="3" opacity="0.6"/>
    <line x1="40" y1="220" x2="80" y2="160" stroke="#E68A5C" stroke-width="3" opacity="0.6"/>
    <line x1="200" y1="20" x2="150" y2="80" stroke="#9577C8" stroke-width="3" opacity="0.6"/>
    <line x1="240" y1="90" x2="170" y2="110" stroke="#5C9CC8" stroke-width="3" opacity="0.6"/>
    <line x1="8" y1="150" x2="70" y2="135" stroke="#E8B84A" stroke-width="3" opacity="0.6"/>
    
    <!-- Center glow -->
    <circle cx="120" cy="120" r="70" fill="url(#ai-grad)" opacity="0.25"/>
  </g>
</svg>
