<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E68A5C"/>
      <stop offset="50%" style="stop-color:#9577C8"/>
      <stop offset="100%" style="stop-color:#5C9CC8"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#000000"/>

  <!-- AI Logo - exact proportions from og-image, scaled 2x -->
  <g transform="translate(16, 16) scale(2)">
    <!-- Central node - r="35" in og-image -->
    <circle cx="120" cy="120" r="35" fill="url(#ai-grad)"/>

    <!-- Orbital rings - rx="100" ry="45" stroke-width="2" in og-image -->
    <ellipse cx="120" cy="120" rx="100" ry="45" fill="none" stroke="#9577C8" stroke-width="2" opacity="0.4" transform="rotate(-20, 120, 120)"/>
    <ellipse cx="120" cy="120" rx="100" ry="45" fill="none" stroke="#E68A5C" stroke-width="2" opacity="0.4" transform="rotate(40, 120, 120)"/>
    <ellipse cx="120" cy="120" rx="100" ry="45" fill="none" stroke="#5C9CC8" stroke-width="2" opacity="0.4" transform="rotate(100, 120, 120)"/>

    <!-- Outer nodes - r="12" in og-image -->
    <circle cx="20" cy="85" r="12" fill="#E8B84A"/>
    <circle cx="220" cy="155" r="12" fill="#7AAA5C"/>
    <circle cx="70" cy="200" r="12" fill="#E68A5C"/>
    <circle cx="170" cy="40" r="12" fill="#9577C8"/>
    <circle cx="200" cy="90" r="12" fill="#5C9CC8"/>
    <circle cx="40" cy="140" r="12" fill="#FFEFB5" stroke="#E8B84A" stroke-width="2"/>

    <!-- Connection lines - stroke-width="2" in og-image -->
    <line x1="20" y1="85" x2="85" y2="105" stroke="#E8B84A" stroke-width="2" opacity="0.5"/>
    <line x1="220" y1="155" x2="155" y2="135" stroke="#7AAA5C" stroke-width="2" opacity="0.5"/>
    <line x1="70" y1="200" x2="100" y2="150" stroke="#E68A5C" stroke-width="2" opacity="0.5"/>
    <line x1="170" y1="40" x2="140" y2="90" stroke="#9577C8" stroke-width="2" opacity="0.5"/>
    <line x1="200" y1="90" x2="155" y2="105" stroke="#5C9CC8" stroke-width="2" opacity="0.5"/>
    <line x1="40" y1="140" x2="85" y2="130" stroke="#E8B84A" stroke-width="2" opacity="0.5"/>

    <!-- Center glow - r="50" in og-image -->
    <circle cx="120" cy="120" r="50" fill="url(#ai-grad)" opacity="0.2"/>
  </g>
</svg>
