<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The AI-Powered Development Framework</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #FBF6E9; -webkit-font-smoothing: antialiased; }
    body { font-family: Inter, system-ui, sans-serif; color: #2A2418; }
    a { transition: opacity 0.2s; }
    a:hover { opacity: 0.85; }
    button:hover { opacity: 0.92; }
    html { scroll-behavior: smooth; }
    ::selection { background: #FFEFB5; }
    @keyframes ripple-out {
      0%   { transform: scale(0); opacity: 0.5; }
      100% { transform: scale(8); opacity: 0; }
    }
    @keyframes gentle-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script src="framework-data.js"></script>
  <script type="text/babel" src="framework-ui.jsx"></script>
  <script type="text/babel" src="framework-stages.jsx"></script>
  <script type="text/babel" src="framework-motion.jsx"></script>
  <script type="text/babel" src="framework-app.jsx"></script>
</body>
</html>
